[project]
name = "veda-daemon"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "veda-shared",
  "veda-llm-router",
  "veda-cap-broadcast",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "apscheduler>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daemon"]

[tool.uv.sources]
veda-shared = { workspace = true }
veda-llm-router = { workspace = true }
veda-cap-broadcast = { workspace = true }
