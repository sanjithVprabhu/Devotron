[project]
name = "veda-template-service"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["veda-shared", "fastapi>=0.115", "uvicorn[standard]>=0.32", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["template_service"]

[tool.uv.sources]
veda-shared = { workspace = true }
