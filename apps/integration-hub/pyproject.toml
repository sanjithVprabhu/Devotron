[project]
name = "veda-integration-hub"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "veda-shared",
  "veda-llm-router",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["integration_hub"]

[tool.uv.sources]
veda-shared = { workspace = true }
veda-llm-router = { workspace = true }
