[project]
name = "veda-orchestrator"
version = "0.0.1"
description = "Agent orchestrator — runs the Veda meta-agent and per-tenant Business Agents."
requires-python = ">=3.11"
dependencies = [
  "veda-shared",
  "veda-llm-router",
  "veda-cap-broadcast",
  "veda-cap-catalog",
  "veda-cap-integration",
  "veda-cap-media",
  "veda-cap-payment",
  "veda-cap-recommendations",
  "veda-cap-scheduling",
  "veda-cap-support",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "langgraph>=0.2.50",
  "langchain-core>=0.3",
  "anthropic>=0.42",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[tool.uv.sources]
veda-shared = { workspace = true }
veda-llm-router = { workspace = true }
veda-cap-broadcast = { workspace = true }
veda-cap-catalog = { workspace = true }
veda-cap-integration = { workspace = true }
veda-cap-media = { workspace = true }
veda-cap-payment = { workspace = true }
veda-cap-recommendations = { workspace = true }
veda-cap-scheduling = { workspace = true }
veda-cap-support = { workspace = true }

[project.scripts]
orchestrator = "orchestrator.main:cli"
