apiVersion: apps/v1
kind: Deployment
metadata: { name: identity-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: identity-service } }
  template:
    metadata: { labels: { app: identity-service } }
    spec:
      containers:
        - name: identity
          image: vedaregistry.azurecr.io/veda-identity-service:latest
          ports: [{ containerPort: 8083 }]
          envFrom:
            - configMapRef: { name: veda-config }
            - secretRef: { name: veda-secrets }
          readinessProbe: { httpGet: { path: /healthz, port: 8083 } }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: identity-service }
spec:
  selector: { app: identity-service }
  ports: [{ port: 80, targetPort: 8083 }]
