apiVersion: apps/v1
kind: Deployment
metadata: { name: integration-hub }
spec:
  replicas: 1
  selector: { matchLabels: { app: integration-hub } }
  template:
    metadata: { labels: { app: integration-hub } }
    spec:
      containers:
        - name: integration
          image: vedaregistry.azurecr.io/veda-integration-hub:latest
          ports: [{ containerPort: 8089 }]
          envFrom:
            - configMapRef: { name: veda-config }
            - secretRef: { name: veda-secrets }
          readinessProbe: { httpGet: { path: /healthz, port: 8089 } }
---
apiVersion: v1
kind: Service
metadata: { name: integration-hub }
spec:
  selector: { app: integration-hub }
  ports: [{ port: 80, targetPort: 8089 }]
