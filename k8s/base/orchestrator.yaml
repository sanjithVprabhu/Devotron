apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
spec:
  replicas: 2
  selector: { matchLabels: { app: orchestrator } }
  template:
    metadata: { labels: { app: orchestrator } }
    spec:
      containers:
        - name: orchestrator
          image: vedaregistry.azurecr.io/veda-orchestrator:latest
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: veda-config }
            - secretRef: { name: veda-secrets }
          readinessProbe: { httpGet: { path: /readyz, port: 8081 }, initialDelaySeconds: 10 }
          livenessProbe:  { httpGet: { path: /healthz, port: 8081 }, initialDelaySeconds: 30 }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2000m", memory: "4Gi" }
---
apiVersion: v1
kind: Service
metadata: { name: orchestrator }
spec:
  selector: { app: orchestrator }
  ports: [{ port: 80, targetPort: 8081 }]
