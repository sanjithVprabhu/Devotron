# Placeholder; populated by CSI driver pulling from Azure Key Vault.
# Each key here is fetched by SecretProviderClass at pod start.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: veda-keyvault
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    keyvaultName: "veda-prod"
    cloudName: "AzurePublicCloud"
    objects: |
      array:
        - |
          objectName: anthropic-api-key
          objectType: secret
        - |
          objectName: meta-system-user-token
          objectType: secret
        - |
          objectName: razorpay-key-secret
          objectType: secret
        - |
          objectName: postgres-url
          objectType: secret
        - |
          objectName: mongo-url
          objectType: secret
        - |
          objectName: redis-url
          objectType: secret
        - |
          objectName: kafka-sasl-password
          objectType: secret
    tenantId: "REPLACE_AZURE_TENANT_ID"
  secretObjects:
    - secretName: veda-secrets
      type: Opaque
      data:
        - objectName: anthropic-api-key
          key: ANTHROPIC_API_KEY
        - objectName: meta-system-user-token
          key: META_SYSTEM_USER_TOKEN
        - objectName: razorpay-key-secret
          key: RAZORPAY_KEY_SECRET
        - objectName: postgres-url
          key: POSTGRES_URL
        - objectName: mongo-url
          key: MONGO_URL
        - objectName: redis-url
          key: REDIS_URL
        - objectName: kafka-sasl-password
          key: KAFKA_SASL_PASSWORD
