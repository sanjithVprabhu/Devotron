apiVersion: apps/v1
kind: Deployment
metadata: { name: catalog-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: catalog-service } }
  template:
    metadata: { labels: { app: catalog-service } }
    spec:
      containers:
        - name: catalog
          image: vedaregistry.azurecr.io/veda-catalog-service:latest
          ports: [{ containerPort: 8085 }]
          envFrom:
            - configMapRef: { name: veda-config }
            - secretRef: { name: veda-secrets }
          readinessProbe: { httpGet: { path: /healthz, port: 8085 } }
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata: { name: catalog-service }
spec:
  selector: { app: catalog-service }
  ports: [{ port: 80, targetPort: 8085 }]
