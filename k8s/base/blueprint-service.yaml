apiVersion: apps/v1
kind: Deployment
metadata: { name: blueprint-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: blueprint-service } }
  template:
    metadata: { labels: { app: blueprint-service } }
    spec:
      containers:
        - name: blueprint
          image: vedaregistry.azurecr.io/veda-blueprint-service:latest
          ports: [{ containerPort: 8084 }]
          envFrom:
            - configMapRef: { name: veda-config }
            - secretRef: { name: veda-secrets }
          readinessProbe: { httpGet: { path: /healthz, port: 8084 } }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: blueprint-service }
spec:
  selector: { app: blueprint-service }
  ports: [{ port: 80, targetPort: 8084 }]
