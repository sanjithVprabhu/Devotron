[project]
name = "veda-cap-scheduling"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["veda-shared", "google-api-python-client>=2.150", "google-auth>=2.36"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veda_cap_scheduling"]

[tool.uv.sources]
veda-shared = { workspace = true }
