[project]
name = "veda-cap-catalog"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["veda-shared", "veda-llm-router", "qdrant-client>=1.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veda_cap_catalog"]

[tool.uv.sources]
veda-shared = { workspace = true }
veda-llm-router = { workspace = true }
