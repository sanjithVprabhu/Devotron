[project]
name = "veda-cap-payment"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["veda-shared", "razorpay>=1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veda_cap_payment"]

[tool.uv.sources]
veda-shared = { workspace = true }
