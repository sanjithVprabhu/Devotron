# Local development infrastructure.
# Production uses managed services (Neon, MongoDB Atlas, Qdrant Cloud, Azure Cache, Confluent).
# This file mirrors them locally so devs can run the stack with `docker compose up`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: veda-postgres
    environment:
      POSTGRES_USER: veda
      POSTGRES_PASSWORD: veda
      POSTGRES_DB: veda
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U veda -d veda']
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: veda-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: veda
      MONGO_INITDB_ROOT_PASSWORD: veda
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: veda-qdrant
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant-data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: veda-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # Redpanda is Kafka-API-compatible and far lighter than Confluent locally.
  # Confluent Cloud handles prod (see spec/04_TECH_STACK.md).
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: veda-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
      - --schema-registry-addr=0.0.0.0:8081
    ports:
      # Kafka broker (PLAINTEXT host listener) — what every client uses.
      - '19092:19092'
      # Internal listeners stay on the docker network. Schema registry and
      # pandaproxy are remapped to 18081/18082 so they don't collide with our
      # orchestrator (8081) and daemon (8082).
      - '18081:8081'
      - '18082:8082'
      - '19644:9644'
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  # Localstack-style Azure Blob alternative for dev. We use Azurite, MS's official emulator.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: veda-azurite
    command: 'azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck'
    ports:
      - '10000:10000'
      - '10001:10001'
      - '10002:10002'
    volumes:
      - azurite-data:/data

  # Lightweight OTel collector for local tracing (writes to stdout).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: veda-otel
    command: ['--config=/etc/otel-config.yaml']
    volumes:
      - ./scripts/otel-config.yaml:/etc/otel-config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'

volumes:
  postgres-data:
  mongo-data:
  qdrant-data:
  redis-data:
  redpanda-data:
  azurite-data:
