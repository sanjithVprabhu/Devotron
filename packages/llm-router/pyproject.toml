[project]
name = "veda-llm-router"
version = "0.0.1"
description = "Multi-provider LLM router with cost tracking, prompt caching, and provider fallback."
requires-python = ">=3.11"
dependencies = [
  "veda-shared",
  "anthropic>=0.42",
  "openai>=1.55",
  "tenacity>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_router"]

[tool.uv.sources]
veda-shared = { workspace = true }
