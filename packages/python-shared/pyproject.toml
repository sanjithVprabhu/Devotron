[project]
name = "veda-shared"
version = "0.0.1"
description = "Shared Pydantic schemas, infra clients, and capability framework for VEDA Python services."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "structlog>=24.4",
  "asyncpg>=0.29",
  "sqlalchemy[asyncio]>=2.0",
  "motor>=3.6",
  "qdrant-client>=1.12",
  "redis>=5.2",
  "aiokafka>=0.12",
  "azure-storage-blob>=12.24",
  "azure-identity>=1.19",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b2",
  "opentelemetry-instrumentation-asyncpg>=0.49b2",
  "opentelemetry-instrumentation-redis>=0.49b2",
  "httpx>=0.27",
  "phonenumbers>=8.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veda_shared"]
